# Все порты, кроме API, доступны только с этой машины (127.0.0.1).
# API открыт в локальной сети, чтобы мобильное приложение могло достучаться с телефона.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Скопируйте .env.example в .env}
      POSTGRES_USER: ${DB_USER:?Скопируйте .env.example в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Скопируйте .env.example в .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Скопируйте .env.example в .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Скопируйте .env.example в .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      ML_SERVICE_URL: http://ml-service:8000
      CHROMA_URL: http://chromadb:8000
      PORT: 3000
      # Без OPENAI_API_KEY сервис работает в демо-режиме: только правила и ML, без LLM и RAG.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      VOICE_PARSE_MODEL: ${VOICE_PARSE_MODEL:-gpt-4o-mini}
      TRANSCRIBE_BACKEND: ${TRANSCRIBE_BACKEND:-ml_service}
      FATSECRET_CLIENT_ID: ${FATSECRET_CLIENT_ID:-}
      FATSECRET_CLIENT_SECRET: ${FATSECRET_CLIENT_SECRET:-}
      # 1 печатает полные промпты и ответы LLM в лог. Только для локальной отладки.
      LLM_PROMPT_DUMP: ${LLM_PROMPT_DUMP:-0}
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./backend/src:/app/backend/src
      - rag_data:/app/backend/data/rag
    networks:
      - app-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # В сервисе нет авторизации, поэтому наружу он не публикуется.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      MODEL_PATH: /app/trained_models
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      WHISPER_PRELOAD: ${WHISPER_PRELOAD:-1}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ml_models:/app/trained_models
      - ./ml-service/app:/app/app
      - whisper_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Исходники с хоста, чтобы dev-сервер подхватывал правки без пересборки.
      - ./frontend:/app/frontend
      # Анонимные тома, чтобы хостовые node_modules и .next не перекрывали контейнерные.
      - /app/frontend/node_modules
      - /app/frontend/.next
    depends_on:
      - backend
    networks:
      - app-network

  chromadb:
    # Образ закреплён по digest: это проверенная версия Chroma 1.4.4.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chromadb_data:/data
    networks:
      - app-network

  # Необязательный веб-интерфейс к БД: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:9.8
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Скопируйте .env.example в .env}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  chromadb_data:
  whisper_cache:
  ml_models:
  rag_data:

networks:
  app-network:
    driver: bridge
